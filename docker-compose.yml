# Local dev infrastructure for Aureus Intelligence.
# Start:  pnpm db:start   (docker compose up -d postgres redis)
# Stop:   pnpm db:stop
# NOTE: requires Docker Desktop to be running.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aureus_postgres
    # Without this the container does not come back when Docker Desktop restarts
    # (e.g. after the machine sleeps), and every page 500s on ECONNREFUSED until
    # someone runs `docker compose up -d` by hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: aureus
      POSTGRES_PASSWORD: aureus
      POSTGRES_DB: aureus
    ports:
      - "5432:5432"
    volumes:
      - aureus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureus -d aureus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aureus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application services (opt-in: `docker compose --profile apps up -d`) ──
  # Default `docker compose up -d` starts only postgres + redis, so the tested
  # pnpm/PM2 workflow keeps working. These add a containerized 24/7 deployment.
  worker:
    build: .
    container_name: aureus_worker
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://aureus:aureus@postgres:5432/aureus
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env.local
        required: false
    command: ["corepack", "pnpm", "worker:start"]
    restart: unless-stopped

  web:
    build: .
    container_name: aureus_web
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://aureus:aureus@postgres:5432/aureus
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env.local
        required: false
    command: ["corepack", "pnpm", "--filter", "@aureus/web", "start"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/today').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  aureus_pgdata:
